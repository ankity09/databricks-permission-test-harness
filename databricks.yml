# Databricks Asset Bundle for the Permission Test Harness app.
#
# Deployment:
#   1. Fill accelerator.yaml with your workspace details
#   2. Run: scripts/provision.py provision --config accelerator.yaml
#   3. Run: databricks bundle deploy --var=warehouse_id=<id> --var=lakebase_project=<id> ...
#
# User-authorization scopes (OBO for admin user token passthrough):
#   sql                           -> run GRANT/REVOKE and probe SELECTs
#   ai-gateway                    -> call the Unity AI Gateway model service (optional assistant)
# Note: iam.access-control:read and iam.current-user:read are default scopes;
# do not declare them explicitly (they will cause conflicts).
# Every deploy can wipe scopes (update_mask replaces wholesale). If OBO breaks,
# re-apply via `databricks apps create-update --resource <app-id>` or redeploy.

bundle:
  name: permission-test-harness

# client/dist is gitignored (build output) but MUST ship so FastAPI can serve
# the React app. Force-include it; keep heavy local dirs out of the upload.
sync:
  include:
    - client/dist/**
  exclude:
    - .venv/**
    - client/node_modules/**
    - tests/**
    - "**/__pycache__/**"

resources:
  apps:
    permission-test-harness:
      name: permission-test-harness
      source_code_path: .
      config:
        command:
          # Wrap in a shell so ${DATABRICKS_APP_PORT} expands (argv form runs no shell).
          - sh
          - -c
          - exec uvicorn app.main:app --host 0.0.0.0 --port ${DATABRICKS_APP_PORT:-8000}
        env:
          - name: HARNESS_WAREHOUSE_ID
            value_from: sql-warehouse
          - name: LAKEBASE_ENDPOINT
            value: projects/${var.lakebase_project}/branches/production/endpoints/${var.lakebase_endpoint}
          - name: HARNESS_DB_SCHEMA
            value: perm_harness
          - name: UAIG_BASE_URL
            value: ${var.uaig_base_url}
          - name: UAIG_MODEL_SERVICE
            value: ${var.uaig_model_service}
          - name: HARNESS_ALLOWED_GROUP
            value: ${var.allowed_group}
      user_api_scopes:
        # iam.access-control:read / iam.current-user:read are default scopes
        # granted automatically (and rejected if declared explicitly here).
        # ai-gateway lets the user's token call the Unity AI Gateway model
        # service, so assistant usage is attributed to the logged-in admin.
        - sql
        - ai-gateway
      resources:
        - name: sql-warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: CAN_USE
        - name: lakebase
          postgres:
            branch: projects/${var.lakebase_project}/branches/production
            database: projects/${var.lakebase_project}/branches/production/databases/databricks-postgres
            permission: CAN_CONNECT_AND_CREATE

# Variables are workspace-specific. Scripts/provision.py discovers or creates many
# of these; pass them at deploy time via `--var k=v` or a target block.
variables:
  warehouse_id:
    description: SQL warehouse id used for probes + grant/revoke statements.
  lakebase_project:
    description: Lakebase project id (Autoscaling Postgres) for activity_log/scenarios.
  lakebase_endpoint:
    description: Lakebase endpoint id under the production branch (usually "primary").
  uaig_base_url:
    description: Unity AI Gateway base URL, e.g. https://<workspace>/ai-gateway/mlflow/v1 ("none" disables the assistant)
    default: none
  uaig_model_service:
    description: Model service as catalog.schema.service ("none" disables the assistant)
    default: none
  allowed_group:
    description: Workspace group allowed to use the app ("none" means anyone with CAN_USE on the app)
    default: none

targets:
  dev:
    default: true
    # Example: fill these in from accelerator.yaml (provisioned via scripts/provision.py),
    # or pass via --var on the CLI. See DEPLOY.md for the guided setup.
    # variables:
    #   warehouse_id: 0123456789abcdef
    #   lakebase_project: perm-harness-lakebase
    #   lakebase_endpoint: primary
    #   uaig_base_url: https://your-workspace.cloud.databricks.com/ai-gateway/mlflow/v1
    #   uaig_model_service: main.perm_harness.harness_agent
    #   allowed_group: ""
