<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" font-family="DM Sans, Helvetica Neue, Arial, sans-serif">
  <defs>
    <marker id="aNavy" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#1B3139"/></marker>
    <marker id="aLava" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#FF3621"/></marker>
    <marker id="aBlue" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2272B4"/></marker>
  </defs>
  <rect width="1600" height="930" fill="#F9F7F4"/>

  <text x="60" y="70" font-size="34" font-weight="700" fill="#1B3139">Permission Test Harness</text>
  <text x="60" y="104" font-size="18" fill="#5A6F77">Every test grant goes to the app's own service principal. Real grants happen in Unity Catalog.</text>

  <!-- Admin -->
  <rect x="60" y="330" width="210" height="110" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
  <text x="165" y="378" font-size="22" font-weight="700" fill="#1B3139" text-anchor="middle">Admin</text>
  <text x="165" y="406" font-size="15" fill="#5A6F77" text-anchor="middle">in the browser</text>
  <line x1="270" y1="385" x2="336" y2="385" stroke="#1B3139" stroke-width="2" marker-end="url(#aNavy)"/>

  <!-- Databricks App -->
  <rect x="340" y="150" width="560" height="520" rx="18" fill="#FFFFFF" stroke="#1B3139" stroke-width="1.5"/>
  <text x="368" y="192" font-size="22" font-weight="700" fill="#1B3139">Databricks App</text>
  <text x="368" y="216" font-size="14" fill="#5A6F77">runs as its own service principal (the app SP)</text>
  <rect x="368" y="232" width="504" height="58" rx="10" fill="#EEEDE9"/>
  <text x="388" y="268" font-size="16" fill="#1B3139"><tspan font-weight="700">React UI:</tspan> Test, Scenarios, Activity, assistant</text>
  <rect x="368" y="306" width="504" height="340" rx="10" fill="#EEEDE9"/>
  <text x="388" y="340" font-size="17" font-weight="700" fill="#1B3139">FastAPI backend</text>
  <g font-size="15" fill="#1B3139">
    <rect x="388" y="371" width="8" height="8" fill="#FF3621"/><text x="408" y="380">Caller check: signed-in user, optional allowed group</text>
    <rect x="388" y="407" width="8" height="8" fill="#FF3621"/><text x="408" y="416">Securable parser: every name validated and quoted</text>
    <rect x="388" y="443" width="8" height="8" fill="#FF3621"/><text x="408" y="452">Grant guard: the GRANT must target only the app SP</text>
    <rect x="388" y="479" width="8" height="8" fill="#FF3621"/><text x="408" y="488">Read-only guard for the query runner</text>
    <rect x="388" y="515" width="8" height="8" fill="#FF3621"/><text x="408" y="524">Assistant tools cannot grant to anyone else</text>
  </g>
  <text x="408" y="560" font-size="14" fill="#5A6F77">Writes the activity log and saved scenarios</text>
  <text x="408" y="596" font-size="14" fill="#5A6F77">Calls the optional assistant with the admin's token</text>

  <!-- Arrows out of the backend -->
  <line x1="872" y1="350" x2="1056" y2="350" stroke="#FF3621" stroke-width="3" marker-end="url(#aLava)"/>
  <circle cx="964" cy="350" r="14" fill="#FF3621"/><text x="964" y="355" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
  <text x="964" y="328" font-size="13" font-weight="700" fill="#FF3621" text-anchor="middle">admin's token</text>
  <line x1="872" y1="410" x2="1056" y2="410" stroke="#2272B4" stroke-width="3" marker-end="url(#aBlue)"/>
  <circle cx="964" cy="410" r="14" fill="#2272B4"/><text x="964" y="415" font-size="15" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
  <text x="964" y="440" font-size="13" font-weight="700" fill="#2272B4" text-anchor="middle">app SP</text>
  <line x1="872" y1="540" x2="1056" y2="540" stroke="#2272B4" stroke-width="2" marker-end="url(#aBlue)"/>
  <text x="964" y="528" font-size="13" fill="#2272B4" text-anchor="middle">app SP</text>
  <line x1="872" y1="630" x2="1056" y2="630" stroke="#FF3621" stroke-width="2" marker-end="url(#aLava)"/>
  <text x="964" y="618" font-size="13" fill="#FF3621" text-anchor="middle">admin's token</text>

  <!-- Workspace services -->
  <rect x="1060" y="300" width="220" height="150" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
  <text x="1170" y="364" font-size="20" font-weight="700" fill="#1B3139" text-anchor="middle">SQL warehouse</text>
  <text x="1170" y="390" font-size="15" fill="#5A6F77" text-anchor="middle">serverless</text>
  <line x1="1280" y1="375" x2="1336" y2="375" stroke="#1B3139" stroke-width="2" marker-end="url(#aNavy)"/>
  <rect x="1340" y="300" width="220" height="150" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
  <text x="1450" y="356" font-size="20" font-weight="700" fill="#1B3139" text-anchor="middle">Unity Catalog</text>
  <text x="1450" y="384" font-size="14" fill="#5A6F77" text-anchor="middle">tables, schemas, volumes,</text>
  <text x="1450" y="404" font-size="14" fill="#5A6F77" text-anchor="middle">functions, models</text>
  <rect x="1060" y="500" width="220" height="80" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
  <text x="1170" y="536" font-size="17" font-weight="700" fill="#1B3139" text-anchor="middle">Lakebase Postgres</text>
  <text x="1170" y="560" font-size="13" fill="#5A6F77" text-anchor="middle">activity log, scenarios</text>
  <rect x="1060" y="596" width="220" height="80" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="1170" y="632" font-size="17" font-weight="700" fill="#1B3139" text-anchor="middle">Unity AI Gateway</text>
  <text x="1170" y="656" font-size="13" fill="#5A6F77" text-anchor="middle">optional assistant</text>

  <!-- Flow -->
  <g font-size="15" fill="#1B3139">
    <rect x="60" y="720" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
    <circle cx="96" cy="756" r="16" fill="#FF3621"/><text x="96" y="761" font-weight="700" fill="#FFFFFF" text-anchor="middle">1</text>
    <text x="124" y="762" font-size="19" font-weight="700">Apply</text>
    <text x="84" y="796">The app grants the candidate permission to the</text>
    <text x="84" y="818">app SP, signed with the admin's token. It works only</text>
    <text x="84" y="840">if the admin has authority, and it is audited under</text>
    <text x="84" y="862">the admin's name.</text>

    <rect x="565" y="720" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
    <circle cx="601" cy="756" r="16" fill="#2272B4"/><text x="601" y="761" font-weight="700" fill="#FFFFFF" text-anchor="middle">2</text>
    <text x="629" y="762" font-size="19" font-weight="700">Attempt</text>
    <text x="589" y="796">The app SP attempts the action itself: SELECT,</text>
    <text x="589" y="818">USE, LIST, EXECUTE, or a permission check. The app</text>
    <text x="589" y="840">shows pass or fail with the real Databricks error.</text>
    <text x="589" y="862">Revoke the test grant when you are done.</text>

    <rect x="1070" y="720" width="470" height="170" rx="14" fill="#FFFFFF" stroke="#D7D5CF" stroke-width="1.5"/>
    <circle cx="1106" cy="756" r="16" fill="#1B3139"/><text x="1106" y="761" font-weight="700" fill="#FFFFFF" text-anchor="middle">3</text>
    <text x="1134" y="762" font-size="19" font-weight="700">Promote</text>
    <text x="1094" y="796">The app shows the exact GRANT and a Unity Catalog</text>
    <text x="1094" y="818">link. The admin makes the real grant in Unity</text>
    <text x="1094" y="840">Catalog, where it is governed and audited. The app</text>
    <text x="1094" y="862">never grants to a person.</text>
  </g>
</svg>
